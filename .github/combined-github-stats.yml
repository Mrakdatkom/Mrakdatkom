name: Update Combined GitHub Stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate combined stats
        env:
          PRIMARY_GITHUB_TOKEN: ${{ secrets.PRIMARY_GITHUB_TOKEN }}
          SECONDARY_GITHUB_TOKEN: ${{ secrets.SECONDARY_GITHUB_TOKEN }}
        run: python scripts/generate_combined_stats.py

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/combined-github-stats-light.svg
          git add assets/combined-github-stats-dark.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update combined GitHub stats"
          git push
